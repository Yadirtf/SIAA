components:
  schemas:
    ActualizarEspacioRequest:
      properties:
        bloqueId:
          type: string
        bufferMetros:
          type: number
        capacidad:
          type: integer
        codigo:
          type: string
        confirmarImpacto:
          description: Confirmación requerida si el espacio tiene sesiones futuras activas (AC-05).
          type: boolean
        estado:
          enum:
          - ACTIVO
          - INACTIVO
          - MANTENIMIENTO
          type: string
        facultadResponsable:
          type: string
        nivelValidacion:
          enum:
          - AULA
          - BLOQUE
          - ZONA
          type: string
        nombre:
          type: string
        piso:
          type: integer
        sedeId:
          type: string
        tipo:
          enum:
          - AULA
          - LABORATORIO
          - AUDITORIO
          - TALLER
          type: string
        torre:
          type: string
      type: object
    ActualizarGeometriaRequest:
      properties:
        coordenadas:
          description: Lista de coordenadas en orden estricto [longitud, latitud] (ADR-04). Mínimo 3 vértices distintos.
          items:
            example:
            - -74.08175
            - 4.60971
            items:
              type: number
            maxItems: 2
            minItems: 2
            type: array
          type: array
        metodoCaptura:
          enum:
          - RECORRIDO_PERIMETRAL
