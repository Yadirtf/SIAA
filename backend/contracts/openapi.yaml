      description: Registra un marcaje nuevo de origen AJUSTE que apunta al original (ajusteDe); el original conserva sus
        datos y queda con reemplazadoPor (RF-JUS-004, US-MAR-09).
      operationId: ajustarMarcaje
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              properties:
                anulado:
                  type: boolean
                motivo:
                  minLength: 20
                  type: string
                nuevoResultado:
                  type: string
              required:
              - motivo
              type: object
        required: true
      responses:
        '200':
          description: Evento de ajuste creado
        '400':
          description: Motivo inválido o menor a 20 caracteres
        '409':
          description: El marcaje ya fue ajustado o la sesión tiene otro marcaje vigente
      summary: Ajustar o anular un marcaje administrativamente (US-MAR-09)
      tags:
      - marcaje
