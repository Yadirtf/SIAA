  /justificaciones:
    get:
      description: El docente ve las propias; el coordinador, las de su ámbito (RF-ROL-003). El total va en X-Total-Count.
        Requiere justificacion:leer.
      operationId: listarJustificaciones
      parameters:
      - description: ''
        in: query
        name: estado
        schema:
          enum:
          - RADICADA
          - EN_REVISION
          - APROBADA
          - RECHAZADA
          type: string
      - description: ''
        in: query
        name: tipo
        schema:
          enum:
          - INCAPACIDAD
          - COMISION
          - PERMISO
          - FALLA_TECNICA
          - CALAMIDAD
          type: string
      - description: ''
        in: query
        name: docenteId
        schema:
          type: string
      - description: Fecha de sesión desde (AAAA-MM-DD)
        in: query
        name: desde
        schema:
          type: string
      - description: Fecha de sesión hasta (AAAA-MM-DD)
        in: query
        name: hasta
        schema:
          type: string
      - description: ''
        in: query
        name: pagina
        schema:
          type: integer
      - description: ''
        in: query
        name: limite
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Justificacion'
                type: array
          description: Justificaciones
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: No autenticado
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Permiso o ámbito denegado
      summary: Bandeja de justificaciones
      tags:
      - justificaciones
    post:
      description: El docente justifica una sesión propia ya iniciada, sin asistencia válida y dentro del plazo en días hábiles
        (RF-JUS-001, RF-JUS-003). Soportes JPG, PNG o PDF de hasta 10 MB (máximo 3), guardados cifrados. Requiere justificacion:crear.
      operationId: radicarJustificacion
      requestBody:
        content:
          multipart/form-data:
            schema:
              properties:
                descripcion:
                  minLength: 10
                  type: string
                sesionId:
                  type: string
                soportes:
                  items:
                    format: binary
                    type: string
                  maxItems: 3
                  type: array
                tipo:
                  enum:
                  - INCAPACIDAD
                  - COMISION
                  - PERMISO
                  - FALLA_TECNICA
                  - CALAMIDAD
                  type: string
              required:
              - sesionId
              - tipo
              - descripcion
              - soportes
              type: object
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Justificacion'
          description: Justificación radicada
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: No autenticado
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Permiso o ámbito denegado
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Sesión no encontrada
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Ya existe una justificación en curso o aprobada para la sesión
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Datos, soporte, plazo o sesión no elegibles
      summary: Radicar justificación
      tags:
      - justificaciones
  /justificaciones/{id}:
