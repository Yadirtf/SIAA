    put:
      operationId: actualizarGeometriaEspacio
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      - description: Precondición optimista opcional con la versionGeometria editada ("3" o W/"3"). Equivale a versionEsperada; si no coincide con la vigente se responde 409 CONFLICTO_VERSION.
        in: header
        name: If-Match
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActualizarGeometriaRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EspacioDTO'
          description: Geometría actualizada correctamente
          headers:
            ETag:
              description: Nueva versionGeometria entre comillas, para usarla como If-Match en la siguiente edición.
              schema:
                type: string
        '400':
          description: Solicitud malformada
        '401':
          description: No autenticado
        '403':
          description: Permiso denegado
        '404':
          description: Espacio no encontrado
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: CONFLICTO_VERSION (la geometría cambió desde que se leyó; contexto.versionVigente indica la actual) o GEOMETRIA_SOLAPADA
        '422':
