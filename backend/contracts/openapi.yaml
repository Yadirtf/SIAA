  /metrics:
    get:
      description: 'Expone latencia p50/p95/p99 por ruta, tasa de error, saturación del pool de base de datos

        y contadores de resultados de marcaje por tipo (US-PLT-05 AC-01, RNF-PER-003).

        '
      operationId: getMetrics
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  baseDatos:
                    type: object
                    description: Pool de conexiones y comandos de MongoDB medidos por los monitores del driver
                    properties:
                      conexionesActivas: &id003
                        type: integer
                      conexionesInactivas: *id003
                      conexionesMaximas: *id003
                      saturacionPorcentaje:
                        type: number
                      comandosTotal: *id003
                      comandosFallidos: *id003
                      latenciaComandos:
                        type: object
                        properties:
                          p50Ms:
                            type: number
                          p95Ms:
                            type: number
                          p99Ms:
                            type: number
                      comandos:
                        type: object
                        additionalProperties: *id003
                  erroresTotal:
                    type: integer
                  resultadosMarcaje:
                    type: object
                    description: Marcajes evaluados por resultado (VALIDO, RETARDO, RECHAZADO_…)
                    additionalProperties: *id003
                  rutas:
                    type: object
                  solicitudesTotal:
                    type: integer
                  tasaError:
                    type: number
                  timestamp:
                    format: date-time
                    type: string
                  uptimeSegundos:
                    type: integer
                required:
                - solicitudesTotal
                - erroresTotal
                - tasaError
                - rutas
                - baseDatos
                type: object
          description: Reporte consolidado de métricas
      security: []
      summary: Obtener métricas y observabilidad del sistema
      tags:
      - observabilidad
