name: CI — SIAA Móvil

on:
  push:
    branches: [main, develop]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'

env:
  FLUTTER_VERSION: "3.47.6" # mismo SDK con el que se generan pubspec.lock y se validan las pruebas
  # Archivos con avisos (warnings) heredados que se corrigen en una tarea en curso.
  # El análisis falla con cualquier otro warning o error. Vaciar cuando queden limpios.
  ANALYZE_WARNING_ALLOWLIST: >-
    lib/core/auth/biometric_auth_service.dart
    lib/core/network/certificate_pinning.dart
    test/core/network/certificate_pinning_test.dart

jobs:
  # ─── Calidad y pruebas (T-PLT-02.1) ────────────────────────────────────────
  quality:
    name: Análisis y pruebas
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Dependencias
        run: flutter pub get

      # El formateo (dart format --set-exit-if-changed) se habilitará cuando el código
      # móvil quede formateado; hoy hay archivos sin formatear en ramas activas.

      - name: flutter analyze (falla con errores y warnings; infos permitidos)
        run: |
          set +e
          flutter analyze --no-fatal-infos --no-fatal-warnings > "$RUNNER_TEMP/analyze.out" 2>&1
          STATUS=$?
          set -e
          cat "$RUNNER_TEMP/analyze.out"
          if [ "$STATUS" -ne 0 ]; then
            echo "❌ flutter analyze reportó errores"
            exit 1
          fi
          WARNINGS=$(grep -E '^\s*warning •' "$RUNNER_TEMP/analyze.out" || true)
          for f in $ANALYZE_WARNING_ALLOWLIST; do
            WARNINGS=$(printf '%s\n' "$WARNINGS" | grep -vF "• $f:" || true)
          done
          if [ -n "$(printf '%s' "$WARNINGS" | tr -d '[:space:]')" ]; then
            echo "❌ Warnings de análisis nuevos:"
            printf '%s\n' "$WARNINGS"
            exit 1
          fi
          echo "✅ Análisis sin errores ni warnings nuevos"

      - name: Pruebas con cobertura
        run: flutter test --timeout 60s --coverage

      - name: Subir reporte de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: mobile-coverage
          path: mobile/coverage/lcov.info

  # ─── Construcción del artefacto (AC-01) ────────────────────────────────────
  build:
    name: Build APK
    runs-on: ubuntu-latest
    needs: quality
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Dependencias
        run: flutter pub get

      - name: flutter build apk
        run: flutter build apk --debug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: siaa-mobile-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
