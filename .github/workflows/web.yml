name: CI — SIAA Consola Web

on:
  push:
    branches: [main, develop]
    paths:
      - 'web/**'
      - '.github/workflows/web.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'web/**'
      - '.github/workflows/web.yml'

env:
  FLUTTER_VERSION: "3.47.6" # mismo SDK con el que se generan pubspec.lock y se validan las pruebas

jobs:
  # ─── Calidad y pruebas (T-PLT-02.1) ────────────────────────────────────────
  quality:
    name: Formato, análisis y pruebas
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Dependencias
        run: flutter pub get

      - name: Verificar formato
        run: dart format --output=none --set-exit-if-changed lib test

      - name: flutter analyze (falla con errores y warnings; infos permitidos)
        run: flutter analyze --no-fatal-infos

      - name: Pruebas con cobertura
        run: flutter test --timeout 60s --coverage

      - name: Subir reporte de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: web-coverage
          path: web/coverage/lcov.info

  # ─── Construcción del artefacto (AC-01) ────────────────────────────────────
  build:
    name: Build web
    runs-on: ubuntu-latest
    needs: quality
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Dependencias
        run: flutter pub get

      - name: flutter build web
        run: flutter build web --release

      - name: Publicar build
        uses: actions/upload-artifact@v4
        with:
          name: siaa-web
          path: web/build/web
